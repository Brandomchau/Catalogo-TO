<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Producto - Tecno Oriental</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { padding-top: 62px; }
    .detail-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: start;
      padding: 3rem 0 5rem;
    }
    .gallery { position: sticky; top: 90px; }
    .main-img-wrap {
      border-radius: var(--radius);
      overflow: hidden;
      aspect-ratio: 1;
      background: var(--bg-card);
      border: 1px solid var(--border);
    }
    .main-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .thumbs {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
    }
    .thumb {
      width: 72px; height: 72px;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      flex-shrink: 0;
      transition: border-color 0.2s;
    }
    .thumb.active { border-color: var(--primary); }
    .thumb { background: var(--bg-card); }
    .thumb img { width: 100%; height: 100%; object-fit: contain; }

    .product-title {
      font-family: var(--font-display);
      font-size: 1.9rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1.15;
      color: var(--text-dark);
      margin-bottom: 0.5rem;
    }
    .product-cat {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.3rem 0.9rem;
      background: linear-gradient(135deg, rgba(0,122,255,0.1), rgba(0,212,255,0.1));
      border-radius: var(--radius-pill);
      font-size: 0.8rem;
      color: var(--primary);
      font-weight: 600;
      margin-bottom: 1.25rem;
    }
    .product-price-lg {
      font-family: var(--font-display);
      font-size: 2.2rem;
      font-weight: 800;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 1rem 0;
    }
    .divider { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }
    .desc { color: var(--text-mid); line-height: 1.75; font-size: 0.95rem; }
    .variants-section { margin: 1.5rem 0; }
    .variants-label { font-size: 0.85rem; font-weight: 600; color: var(--text-mid); margin-bottom: 0.6rem; }
    .variants-list { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .variant-chip {
      padding: 0.5rem 1.1rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-pill);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--bg-card);
      color: var(--text-dark);
    }
    .variant-chip.selected {
      border-color: var(--primary);
      background: linear-gradient(135deg, rgba(0,122,255,0.12), rgba(0,212,255,0.12));
      color: var(--primary);
      font-weight: 600;
    }
    .qty-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1.5rem 0;
    }
    .qty-label { font-size: 0.88rem; font-weight: 600; color: var(--text-mid); }
    .qty-ctrl {
      display: flex;
      align-items: center;
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-pill);
      overflow: hidden;
    }
    .qty-ctrl button {
      width: 38px; height: 38px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-mid);
      font-size: 1rem;
      transition: background 0.2s;
    }
    .qty-ctrl button:hover { background: var(--bg); color: var(--primary); }
    .qty-ctrl span {
      width: 50px;
      text-align: center;
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-dark);
    }
    .action-row { display: flex; gap: 1rem; margin-top: 1rem; }
    .trust-row {
      display: flex;
      gap: 1.5rem;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }
    .trust-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      color: var(--text-light);
    }
    .trust-item i { color: var(--primary); }

    .wholesale-row {
      display: flex; align-items: center; gap: 0.5rem;
      font-size: 0.88rem; color: var(--text-mid); margin-top: -0.5rem; margin-bottom: 1rem;
    }
    .wholesale-row strong { color: var(--text-dark); }
    .note-box {
      display: flex; align-items: flex-start; gap: 0.6rem;
      background: rgba(255,159,10,0.08); border: 1px solid rgba(255,159,10,0.25);
      border-radius: var(--radius-sm); padding: 0.85rem 1rem;
      font-size: 0.85rem; color: var(--text-mid); margin: 1rem 0; line-height: 1.5;
    }
    .note-box i { color: #ff9f0a; margin-top: 0.15rem; flex-shrink: 0; }

    /* Related */
    .related { background: var(--bg); padding: 4rem 0; }
    .related-title {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
    }

    @media (max-width: 768px) {
      .detail-layout { grid-template-columns: 1fr; gap: 2rem; }
      .gallery { position: static; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="breadcrumb" id="breadcrumb" style="padding-top:1.5rem;">
      <a href="../index.html">Inicio</a>
      <span>/</span>
      <a href="../productos.html">Productos</a>
      <span>/</span>
      <span id="bc-name">…</span>
    </div>

    <div class="detail-layout" id="detail-layout">
      <div style="text-align:center;padding:5rem;color:var(--text-light);grid-column:1/-1;">
        <i class="fas fa-spinner fa-spin fa-2x"></i>
      </div>
    </div>
  </div>

  <!-- Related -->
  <div class="related" id="related-section" style="display:none;">
    <div class="container">
      <h3 class="related-title">Productos relacionados</h3>
      <div class="products-grid" id="related-grid"></div>
    </div>
  </div>

  <script src="../js/store.js"></script>
  <script src="../js/layout.js"></script>
  <script>
    injectNav('products');
    injectFooter();

    let selectedVariant = null;
    let currentProduct = null;

    function pageInit() {
      const id = parseInt(new URLSearchParams(window.location.search).get('id'));
      currentProduct = G9Store.getProduct(id);

      if (!currentProduct) {
        document.getElementById('detail-layout').innerHTML = `
          <div class="empty-state" style="grid-column:1/-1;">
            <i class="fas fa-exclamation-triangle"></i>
            <h2>Producto no encontrado</h2>
            <p>Este producto no existe o fue eliminado</p>
            <a href="../productos.html" class="btn btn-primary" style="margin-top:1.5rem;">Ver todos los productos</a>
          </div>`;
        return;
      }

      document.title = `${currentProduct.name} - Tecno Oriental`;
      document.getElementById('bc-name').textContent = currentProduct.name;

      const cat = G9Store.getCategory(currentProduct.category_id);
      const img = G9Store.imgSrc(currentProduct.images && currentProduct.images[0]);
      const available = currentProduct.available !== false;

      const thumbsHTML = currentProduct.images.length > 1
        ? currentProduct.images.map((url, i) => `
            <div class="thumb ${i === 0 ? 'active' : ''}" onclick="changeImg('${G9Store.imgSrc(url)}', this)">
              <img src="${G9Store.imgSrc(url)}" alt="" loading="lazy">
            </div>`).join('')
        : '';

      const variantsHTML = currentProduct.variants.length > 0 ? `
        <div class="variants-section">
          <div class="variants-label">Variante</div>
          <div class="variants-list" id="variants-list">
            ${currentProduct.variants.map(v => `
              <div class="variant-chip" data-id="${v.id}" data-price="${v.price}" onclick="selectVariant(this)">
                ${v.name}: ${v.value}
              </div>`).join('')}
          </div>
        </div>` : '';

      document.getElementById('detail-layout').innerHTML = `
        <div class="gallery">
          <div class="main-img-wrap">
            <img src="${img}" alt="${currentProduct.name}" id="main-img">
          </div>
          ${thumbsHTML ? `<div class="thumbs">${thumbsHTML}</div>` : ''}
        </div>
        <div class="info">
          ${cat ? `<span class="product-cat"><i class="fas fa-tag"></i> ${cat.name}</span>` : ''}
          <h1 class="product-title">${currentProduct.name}</h1>
         <div class="product-price-lg" id="prod-price" style="display:none;">${formatPriceOrQuote(currentProduct.price)}</div>
          ${currentProduct.wholesale_price ? `
            <div class="wholesale-row">
              <i class="fas fa-boxes-stacked"></i> Precio mayorista: <strong>${formatPrice(currentProduct.wholesale_price)}</strong>
            </div>` : ''}
          <span class="stock-pill ${available ? 'in' : 'out'}">
            ${available ? '<i class="fas fa-check-circle"></i> Disponible' : '<i class="fas fa-times-circle"></i> No disponible'}
          </span>
          <hr class="divider">
          ${currentProduct.description ? `<div class="desc">${currentProduct.description}</div>` : ''}
          ${currentProduct.note ? `<div class="note-box"><i class="fas fa-circle-info"></i> ${currentProduct.note}</div>` : ''}
          ${variantsHTML}
          <div class="action-row">
            <button class="btn btn-primary btn-lg" style="flex:2;" onclick="addToCartDetail()" id="add-btn" ${!available ? 'disabled' : ''}>
              <i class="fas fa-square-check"></i> Seleccionar producto
            </button>
            <a href="../carrito.html" class="btn btn-ghost btn-lg" style="flex:1;">
              <i class="fas fa-eye"></i> Ver selección
            </a>
          </div>
          <div class="trust-row">
            <span class="trust-item"><i class="fas fa-shield-alt"></i> Compra segura</span>
            <span class="trust-item"><i class="fas fa-undo"></i> 30 días devolución</span>
            <span class="trust-item"><i class="fas fa-shipping-fast"></i> Envío rápido</span>
          </div>
        </div>`;

      // Related products
      const related = G9Store.getProducts({ category_id: currentProduct.category_id })
        .filter(p => p.id !== currentProduct.id)
        .slice(0, 4);

      if (related.length > 0) {
        document.getElementById('related-section').style.display = '';
        document.getElementById('related-grid').innerHTML = related.map(productCardHTML).join('');
      }
    }

    function changeImg(url, el) {
      document.getElementById('main-img').src = url;
      document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
    }

    function selectVariant(el) {
      document.querySelectorAll('.variant-chip').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
      selectedVariant = parseInt(el.dataset.id);
      const price = parseFloat(el.dataset.price);
      document.getElementById('prod-price').textContent = formatPrice(price);
    }

    function addToCartDetail() {
      if (!currentProduct) return;
      const result = G9Store.cart.add(currentProduct.id, selectedVariant);
      if (result === 'added') showToast(`${currentProduct.name} añadido a tu selección`);
      else if (result === 'already') showToast('Ya estaba en tu selección');
      else showToast('Error al seleccionar', 'error');
    }
  </script>
</body>
</html>
