<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitud Enviada - Tecno Oriental</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { padding-top: 62px; }
    .success-wrap {
      max-width: 700px;
      margin: 4rem auto;
      padding: 0 1.5rem 5rem;
      text-align: center;
    }
    .success-icon {
      width: 100px; height: 100px;
      background: linear-gradient(135deg, #34c759, #30d158);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 2rem;
      font-size: 2.5rem;
      color: white;
      animation: popIn 0.5s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes popIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .success-title {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 0.5rem;
    }
    .success-sub { color: var(--text-light); margin-bottom: 2rem; }
    .order-num {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, rgba(0,122,255,0.08), rgba(0,212,255,0.08));
      border: 1px solid rgba(0,122,255,0.2);
      padding: 0.75rem 1.75rem;
      border-radius: var(--radius-pill);
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 2.5rem;
    }
    .details-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-align: left;
      overflow: hidden;
      margin-bottom: 2rem;
    }
    .details-section {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .details-section:last-child { border-bottom: none; }
    .details-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-light);
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .details-label i { color: var(--primary); }
    .order-item-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      padding: 0.4rem 0;
      color: var(--text-mid);
    }
    .order-total-row {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.1rem;
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
    }
    .order-total-row span:last-child { color: var(--primary); }

    /* Timeline */
    .timeline {
      display: flex;
      justify-content: space-between;
      position: relative;
      padding: 0 1rem;
      margin: 0.5rem 0;
    }
    .timeline::before {
      content: '';
      position: absolute;
      top: 18px; left: 2.5rem; right: 2.5rem;
      height: 2px;
      background: var(--border);
      z-index: 0;
    }
    .tl-step { position: relative; z-index: 1; text-align: center; }
    .tl-dot {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--bg-card);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      color: var(--text-light);
      margin: 0 auto 0.4rem;
    }
    .tl-step.active .tl-dot {
      background: var(--gradient);
      border-color: transparent;
      color: white;
    }
    .tl-label { font-size: 0.72rem; color: var(--text-light); }
    .tl-step.active .tl-label { color: var(--primary); font-weight: 600; }

    .action-btns { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }

    .order-item-row img {
      width: 36px; height: 36px; object-fit: cover; border-radius: 6px;
      margin-right: 0.6rem; flex-shrink: 0; vertical-align: middle;
    }
    .order-item-row { align-items: center; }
    .order-item-left { display: flex; align-items: center; }

    @media print {
      .navbar-custom, .footer-custom, .action-btns, .g9-toast { display: none !important; }
      body { padding-top: 0; }
      .success-wrap { margin: 0 auto; }
    }

    @media (max-width: 480px) {
      .success-title { font-size: 1.5rem; }
      .details-section { padding: 1rem 1.1rem; }
    }
  </style>
</head>
<body>

  <div class="success-wrap" id="content">
    <div style="color:var(--text-light);padding:5rem;"><i class="fas fa-spinner fa-spin fa-2x"></i></div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/layout.js"></script>
  <script>
    injectNav('');
    injectFooter();

    function pageInit() {
      const orderId = parseInt(new URLSearchParams(window.location.search).get('id'));
      const orders = G9Store.orders.get();
      const order = orders.find(o => o.id === orderId);

      if (!order) {
        document.getElementById('content').innerHTML = `
          <div class="empty-state">
            <i class="fas fa-exclamation-triangle"></i>
            <h2>Pedido no encontrado</h2>
            <a href="index.html" class="btn btn-primary" style="margin-top:1.5rem;">Volver al inicio</a>
          </div>`;
        return;
      }

      const itemsHTML = order.items.map(item => `
        <div class="order-item-row">
          <span class="order-item-left">
            <img src="${G9Store.imgSrc(item.image)}" alt="${item.name}">
            ${item.name} × ${item.quantity}${item.variant_info ? ` (${item.variant_info})` : ''}
          </span>
          <span>${formatPrice(item.price * item.quantity)}</span>
        </div>`).join('');

      document.getElementById('content').innerHTML = `
        <div class="success-icon"><i class="fas fa-check"></i></div>
        <h1 class="success-title">¡Solicitud Enviada!</h1>
        <p class="success-sub">Recibimos tu pedido por correo. Te contactaremos pronto para coordinar pago y entrega.</p>
        <div class="order-num"><i class="fas fa-receipt"></i> Pedido #${order.id}</div>

        <div class="details-card">
          <div class="details-section">
            <div class="details-label"><i class="fas fa-user"></i> Cliente</div>
            <p style="font-weight:600;color:var(--text-dark);">${order.customer.name}</p>
            <p style="font-size:.88rem;color:var(--text-mid);">${order.customer.email} · ${order.customer.phone}</p>
          </div>
          <div class="details-section">
            <div class="details-label"><i class="fas fa-map-marker-alt"></i> Dirección</div>
            <p style="font-size:.9rem;color:var(--text-mid);">${order.customer.address}</p>
          </div>
          <div class="details-section">
            <div class="details-label"><i class="fas fa-shopping-bag"></i> Productos</div>
            ${itemsHTML}
            <div class="order-total-row">
              <span>Total estimado</span>
              <span>${formatPrice(order.total)}</span>
            </div>
          </div>
          <div class="details-section">
            <div class="details-label"><i class="fas fa-truck"></i> Estado del pedido</div>
            <div class="timeline">
              <div class="tl-step active">
                <div class="tl-dot"><i class="fas fa-check"></i></div>
                <div class="tl-label">Confirmado</div>
              </div>
              <div class="tl-step">
                <div class="tl-dot"><i class="fas fa-box"></i></div>
                <div class="tl-label">Preparando</div>
              </div>
              <div class="tl-step">
                <div class="tl-dot"><i class="fas fa-truck"></i></div>
                <div class="tl-label">En camino</div>
              </div>
              <div class="tl-step">
                <div class="tl-dot"><i class="fas fa-home"></i></div>
                <div class="tl-label">Entregado</div>
              </div>
            </div>
          </div>
          <div class="details-section">
            <div class="details-label"><i class="fas fa-calendar"></i> Fecha</div>
            <p style="font-size:.88rem;color:var(--text-mid);">${formatDate(order.created_at)}</p>
          </div>
        </div>

        <div class="action-btns">
          <button onclick="window.print()" class="btn btn-ghost">
            <i class="fas fa-print"></i> Guardar recibo en PDF
          </button>
          <a href="productos.html" class="btn btn-primary">
            <i class="fas fa-shopping-bag"></i> Seguir comprando
          </a>
        </div>`;
    }
  </script>
</body>
</html>
