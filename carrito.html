<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito - Tecno Oriental</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { padding-top: 62px; }
    .cart-layout {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 2.5rem;
      align-items: start;
      padding: 3rem 0 5rem;
    }
    /* Cart items */
    .cart-items { display: flex; flex-direction: column; gap: 1rem; }
    .cart-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      display: flex;
      gap: 1.25rem;
      align-items: center;
      transition: box-shadow 0.2s;
    }
    .cart-item:hover { box-shadow: var(--shadow-md); }
    .item-img {
      width: 90px; height: 90px;
      border-radius: 10px;
      object-fit: contain;
      background: var(--bg);
      flex-shrink: 0;
    }
    .item-info { flex: 1; min-width: 0; }
    .item-name {
      font-family: var(--font-display);
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-dark);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-variant { font-size: 0.78rem; color: var(--text-light); margin-top: 0.2rem; }
    .item-unit { font-size: 0.82rem; color: var(--text-light); margin-top: 0.3rem; }
    .item-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-shrink: 0;
    }
    .qty-ctrl-sm {
      display: flex;
      align-items: center;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-pill);
      overflow: hidden;
    }
    .qty-ctrl-sm button {
      width: 32px; height: 32px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-mid);
      font-size: 0.8rem;
    }
    .qty-ctrl-sm button:hover { background: var(--bg); color: var(--primary); }
    .qty-ctrl-sm span {
      width: 38px;
      text-align: center;
      font-weight: 600;
      font-size: 0.88rem;
    }
    .item-subtotal {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1rem;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      min-width: 70px;
      text-align: right;
    }
    .remove-btn {
      background: none;
      border: none;
      color: var(--text-light);
      cursor: pointer;
      font-size: 1rem;
      padding: 0.3rem;
      transition: color 0.2s;
    }
    .remove-btn:hover { color: #ff3b30; }

    /* Summary */
    .summary-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.75rem;
      position: sticky;
      top: 90px;
    }
    .summary-title {
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 1.5rem;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      padding: 0.6rem 0;
      border-bottom: 1px solid var(--border);
      color: var(--text-mid);
    }
    .summary-row:last-of-type { border-bottom: none; }
    .summary-total {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.25rem;
      padding-top: 1rem;
      border-top: 2px solid var(--border);
      margin-top: 0.5rem;
    }
    .summary-total span:last-child {
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .promo-row {
      display: flex;
      gap: 0.5rem;
      margin: 1rem 0;
    }
    .promo-row input {
      flex: 1;
      padding: 0.55rem 0.9rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      color: var(--text-dark);
      font-size: 0.85rem;
      font-family: var(--font-body);
    }
    .secure-note {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      color: var(--text-light);
      justify-content: center;
      margin-top: 1rem;
    }
    .secure-note i { color: #34c759; }

    @media (max-width: 800px) {
      .cart-layout { grid-template-columns: 1fr; }
      .summary-card { position: static; }
      .item-actions { flex-wrap: wrap; }
    }
    @media (max-width: 480px) {
      .cart-item { flex-direction: column; align-items: flex-start; }
      .item-img { width: 100%; height: 200px; border-radius: var(--radius); }
      .item-actions { width: 100%; justify-content: space-between; }
    }
  </style>
</head>
<body>

  <div class="page-header">
    <h1><i class="fas fa-shopping-cart"></i> Carrito de Compras</h1>
  </div>

  <div class="container">
    <div id="cart-content">
      <!-- Injected by JS -->
    </div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/layout.js"></script>
  <script>
    injectNav('');
    injectFooter();

    function renderCart() {
      const cart = G9Store.cart.get();
      const container = document.getElementById('cart-content');

      if (cart.length === 0) {
        container.innerHTML = `
          <div class="empty-state" style="padding:5rem 0;">
            <i class="fas fa-shopping-cart"></i>
            <h2>Tu carrito está vacío</h2>
            <p>Agrega productos para comenzar</p>
            <a href="productos.html" class="btn btn-primary" style="margin-top:1.5rem;">
              <i class="fas fa-shopping-bag"></i> Explorar Productos
            </a>
          </div>`;
        return;
      }

      const subtotal = G9Store.cart.total();
      const iva = subtotal * 0.15; // ISV Honduras
      const total = subtotal + iva;

      container.innerHTML = `
        <div class="cart-layout">
          <div>
            <div class="cart-items" id="cart-items-list">
              ${cart.map(item => `
                <div class="cart-item">
                  <img class="item-img" src="${G9Store.imgSrc(item.image)}" alt="${item.name}" loading="lazy">
                  <div class="item-info">
                    <div class="item-name">${item.name}</div>
                    ${item.variant_info ? `<div class="item-variant"><i class="fas fa-tag"></i> ${item.variant_info}</div>` : ''}
                 
                  </div>
                  <div class="item-actions">
                    <div class="qty-ctrl-sm">
                 
                    </div>
                  
                    <button class="remove-btn" onclick="removeItem('${item.key}')" title="Eliminar">
                      <i class="fas fa-trash"></i>
                    </button>
                  </div>
                </div>`).join('')}
            </div>
            <div style="margin-top:1.5rem;">
              <a href="productos.html" class="btn btn-ghost">
                <i class="fas fa-arrow-left"></i> Seguir comprando
              </a>
            </div>     
            <div class="secure-note">
              <i class="fas fa-shield-alt"></i> Pago 100% seguro y protegido
            </div>
          </div>
        </div>`;
    }

    function updateQty(key, qty) {
      if (qty < 1) { removeItem(key); return; }
      G9Store.cart.updateQuantity(key, qty);
      renderCart();
    }

    function removeItem(key) {
      G9Store.cart.remove(key);
      renderCart();
      showToast('Producto eliminado del carrito');
    }

    function pageInit() { renderCart(); }
  </script>
</body>
</html>
